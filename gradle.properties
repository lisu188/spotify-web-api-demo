# Gradle will use the toolchain configured in build.gradle.kts for Java 21.
javaVersion=21

# Bound compiler memory for clean builds and CodeQL's instrumented compilation.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
